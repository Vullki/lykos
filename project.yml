# XcodeGen spec for Lykos. This file is the source of truth: the .xcodeproj is generated
# from it on the macOS build runner and never committed. Phase 1 added the permission keys
# and the lykos:// URL scheme; Phase 3 adds the extension targets and the App Group.

name: Lykos

options:
  bundleIdPrefix: com.vullki
  deploymentTarget:
    iOS: "15.0"   # 15+ so TrollStore (iOS 14.0-16.6.1, 16.7 RC, 17.0) can install it too
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # The app's bundle ID. com.vullki.lykos is the original build's ID and never changes
    # (login data is tied to it). A fork signs with its own Apple account, so it sets its own
    # ID here, or CI passes LYKOS_BUNDLE_ID from the repo variable of the same name.
    # Phase 3 extensions derive theirs from it: $(LYKOS_BUNDLE_ID).share and .widget.
    LYKOS_BUNDLE_ID: com.vullki.lykos
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"   # CI overrides this with github.run_number
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Lykos:
    type: application
    platform: iOS
    sources:
      - path: App
    scheme: {}   # shared "Lykos" scheme, so CI can build and archive with -scheme Lykos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LYKOS_BUNDLE_ID)   # set once above; login data is tied to it
        PRODUCT_NAME: Lykos
        TARGETED_DEVICE_FAMILY: "1"                   # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: App/Info.plist   # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: Lykos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LykosMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Phase 1 permission prompts: the web page asks, iOS shows these reasons once.
        NSMicrophoneUsageDescription: "Lykos uses the microphone for voice input in your chats."
        NSCameraUsageDescription: "Lykos uses the camera to take photos you attach to a chat."
        NSPhotoLibraryUsageDescription: "Lykos lets you choose photos from your library to attach to a chat."
        # Needed by the share sheet's Save Image for downloaded images (iOS ends the app without it).
        NSPhotoLibraryAddUsageDescription: "Lykos saves images you download from a chat to your photo library."
        # lykos://new opens a new chat (used by the widget, Siri and Shortcuts in Phase 3).
        CFBundleURLTypes:
          - CFBundleURLName: com.vullki.lykos
            CFBundleURLSchemes:
              - lykos
