<!doctype html>
<!-- Source for docs/screenshots/showcase.png (README screenshot row).
     Render: see design/readme/README.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .row {
    width: 1600px; height: 800px; box-sizing: border-box;
    display: flex; justify-content: center; align-items: flex-start;
    gap: 56px; padding-top: 24px;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  /* brushed-titanium rail */
  .phone {
    width: 316px; aspect-ratio: 1 / 2; padding: 7px; box-sizing: content-box;
    border-radius: 54px;
    background: linear-gradient(140deg, #4a4a4a 0%, #d9d9d9 18%, #7a7a7a 40%, #cfcfcf 66%, #5a5a5a 88%, #9a9a9a 100%);
    box-shadow: 0 26px 48px -18px rgba(0,0,0,.55);
  }
  .bezel { width: 100%; height: 100%; padding: 6px; box-sizing: border-box;
           border-radius: 47px; background: #000; }
  .screen { width: 100%; height: 100%; border-radius: 41px; overflow: hidden; background: #000; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  figcaption {
    margin-top: 30px; font: 500 21px/1 "Inter", "Segoe UI", sans-serif;
    letter-spacing: .32em; text-transform: uppercase; color: #8c8c8c;
    padding-left: .32em; /* balance the trailing tracking */
  }
</style>
</head>
<body>
<div class="row">
  <figure><div class="phone"><div class="bezel"><div class="screen"><img src="../../docs/screenshots/launch.jpg" alt=""></div></div></div><figcaption>Launch</figcaption></figure>
  <figure><div class="phone"><div class="bezel"><div class="screen"><img src="../../docs/screenshots/chat.jpg" alt=""></div></div></div><figcaption>Chat</figcaption></figure>
  <figure><div class="phone"><div class="bezel"><div class="screen"><img src="../../docs/screenshots/sidebar.jpg" alt=""></div></div></div><figcaption>Sidebar</figcaption></figure>
  <figure><div class="phone"><div class="bezel"><div class="screen"><img src="../../docs/screenshots/code.jpg" alt=""></div></div></div><figcaption>Code</figcaption></figure>
</div>
</body>
</html>
