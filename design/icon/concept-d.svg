<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept D: Ly Wrap. The y sits in the corner of the L. Its long stroke runs past the L's foot
       (the foot's end is cut parallel to it), wraps under the L and rises up its left side to an angled,
       fang-like tip. One even 24 px gap between the letters everywhere. Brushed Silver Noir. -->
  <defs>
    <radialGradient id="bg" cx="512" cy="420" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="230" x2="0" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCDCDC"/>
      <stop offset="0.30" stop-color="#C2C2C2"/>
      <stop offset="0.62" stop-color="#808080"/>
      <stop offset="1" stop-color="#464646"/>
    </linearGradient>
    <filter id="metal" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.55" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComposite in="SourceGraphic" in2="mono" operator="arithmetic" k1="0" k2="1" k3="0.2" k4="-0.1" result="grained"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="6" specularConstant="0.85" specularExponent="24" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="grained" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <!-- y terminals: arms cut flat at the x-height (y 400), tail cut at an angle rising toward the L -->
    <clipPath id="yclip" clipPathUnits="userSpaceOnUse">
      <polygon points="1024,400 330,400 330,466 200,536 0,536 0,1024 1024,1024"/>
    </clipPath>
    <g id="mark">
      <!-- L: stem, and a foot whose end is cut parallel to the y's long stroke -->
      <polygon points="330,230 418,230 418,612 610,612 573,700 330,700"/>
      <g clip-path="url(#yclip)">
        <!-- y: short arm -->
        <path d="M 484 360 L 691 590" stroke-width="74" fill="none"/>
        <!-- y: long stroke, past the foot, under the L, up its left side -->
        <path d="M 787 360 L 631 735 Q 617 768 585 768 L 352 768 A 90 90 0 0 1 262 678 L 262 440"
              stroke-width="88" fill="none" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.92) translate(-526 -521)">
    <use href="#mark" fill="#ffffff" stroke="#ffffff" opacity="0.07" filter="url(#glow)"/>
    <use href="#mark" fill="url(#silver)" stroke="url(#silver)" filter="url(#metal)"/>
  </g>
</svg>
