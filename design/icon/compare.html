<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lykos Λ vs Ly</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background:#000; color:#E6E4DF; font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; padding:28px 24px; }
  .tag { color:#C2C2C2; text-transform:uppercase; letter-spacing:.3em; font-size:11px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:16px; }
  .card { background:#0D0D0D; border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:20px; }
  h2 { font-weight:400; font-size:18px; margin:2px 0 14px; }
  .big { width:100%; max-width:420px; aspect-ratio:1; border-radius:22.37%; display:block; margin:0 auto; }
  .row { display:flex; align-items:center; gap:14px; margin-top:16px; padding:14px; border-radius:14px; }
  .row.dark { background:linear-gradient(135deg,#1d1d22,#0b0b0e); }
  .row.light { background:linear-gradient(135deg,#e9e7e2,#bfc3c8); }
  .row img { border-radius:22.37%; }
  .s60{width:60px}.s40{width:40px}.s29{width:29px}
  .tint { filter:grayscale(1) brightness(1.15) sepia(.35) hue-rotate(170deg) saturate(1.4); }
</style>
</head>
<body>
  <div class="tag">Lykos · Brushed Silver Noir</div>
  <div class="grid">
    <div class="card"><div class="tag">Chosen</div><h2>Λ Monolith</h2>
      <img class="big" src="concept-a.svg" alt="">
      <div class="row dark"><img class="s60" src="concept-a.svg" alt=""><img class="s40" src="concept-a.svg" alt=""><img class="s29" src="concept-a.svg" alt=""></div>
      <div class="row light"><img class="s60" src="concept-a.svg" alt=""><img class="s60 tint" src="concept-a.svg" alt=""></div>
    </div>
    <div class="card"><div class="tag">New</div><h2>Ly Wrap</h2>
      <img class="big" src="concept-d.svg" alt="">
      <div class="row dark"><img class="s60" src="concept-d.svg" alt=""><img class="s40" src="concept-d.svg" alt=""><img class="s29" src="concept-d.svg" alt=""></div>
      <div class="row light"><img class="s60" src="concept-d.svg" alt=""><img class="s60 tint" src="concept-d.svg" alt=""></div>
    </div>
  </div>
</body>
</html>
